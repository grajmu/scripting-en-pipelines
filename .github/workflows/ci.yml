name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v5

      - name: Compilar
        run: |
          echo "Empaquetando la app..."
          echo "build del $(date +%F)" > app.txt
          cat app.txt

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Bajar el código
        uses: actions/checkout@v5

      - name: Correr tests
        run: |
          echo "Corriendo tests..."
          ./scripts/hola.sh Test

  seguridad:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Escanear
        run: echo "Buscando vulnerabilidades... todo OK ✅"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, seguridad]
    steps:
      - name: Desplegar
        run: echo "Poniendo en producción 🚀"
